<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexlo</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#1b1f24;--mut:#6b7480;--line:#e3e6ea;--ok:#169a50;--bad:#c0392b;--card:#f5f7f9}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1f24;--fg:#e8eaed;--mut:#9aa3ad;--line:#2e333a;--card:#252a30}}
  *{box-sizing:border-box}
  body{margin:0;width:360px;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,'Segoe UI',sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  header img{width:22px;height:22px;border-radius:5px}
  header b{font-size:14px}
  .st{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .dot.ok{background:var(--ok)}
  main{max-height:380px;overflow:auto}
  .empty{padding:26px 16px;text-align:center;color:var(--mut)}
  .it{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .it:hover{background:var(--card)}
  .tag{flex:none;padding:2px 6px;border-radius:4px;background:#dff5e8;color:#0f7a3c;font-size:11px;font-weight:700}
  @media (prefers-color-scheme:dark){.tag{background:#23382b;color:#7be0a4}}
  .tag.audio{background:#f7e8d8;color:#9a5a12}
  .info{flex:1;min-width:0}
  .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sz{color:var(--mut);font-size:12px}
  button{border:0;border-radius:6px;padding:6px 11px;background:var(--ok);color:#fff;font:600 12px system-ui;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:default}
  footer{display:flex;gap:8px;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);color:var(--mut)}
  footer a{color:var(--mut);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header><img src="icons/icon.svg" alt=""><b>Vexlo</b><span class="st"><span class="dot" id="dot"></span><span id="stText">…</span></span></header>
<main id="list"></main>
<footer><a id="clear">✕</a><a id="opts">⚙</a></footer>
<script src="lib/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
