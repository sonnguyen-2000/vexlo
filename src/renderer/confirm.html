<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông tin tải xuống</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="confirm.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
</svg>

<main class="dlg" id="dlg">
  <div class="head">
    <span class="badge" id="badge" data-cat="other"><svg class="ic"><use id="badgeUse" href="#i-file"/></svg></span>
    <div class="headtxt">
      <input class="inp name" id="name" spellcheck="false" autocomplete="off" placeholder="Tự động theo máy chủ" aria-label="Tên tệp">
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <input type="hidden" id="url">

  <div class="field">
    <label for="dir">Lưu vào</label>
    <div class="row">
      <input class="inp" id="dir" readonly spellcheck="false">
      <button class="btn icon" id="browse" type="button" title="Chọn thư mục khác" aria-label="Chọn thư mục khác"><svg class="ic"><use href="#i-folder"/></svg></button>
    </div>
  </div>

  <div class="opts">
    <div class="field" id="qualityField">
      <label for="quality">Chất lượng video</label>
      <select class="sel" id="quality">
        <option value="best">Cao nhất</option>
        <option value="1080">Tối đa 1080p</option>
        <option value="720">Tối đa 720p</option>
        <option value="480">Tối đa 480p</option>
        <option value="360">Tối đa 360p</option>
        <option value="worst">Thấp nhất</option>
      </select>
    </div>
    <div class="field narrow">
      <label for="conn">Kết nối</label>
      <select class="sel" id="conn">
        <option value="1">1</option><option value="2">2</option><option value="4">4</option>
        <option value="8">8</option><option value="16">16</option><option value="32">32</option>
      </select>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>

  <div class="foot">
    <label class="chk" title="Lần sau tải ngay, không hiện hộp thoại này. Bật lại trong Tùy chọn."><input type="checkbox" id="dontAsk"><span>Không hỏi lại</span></label>
    <div class="actions">
      <button class="btn ghost" id="cancel" type="button">Hủy</button>
      <button class="btn" id="later" type="button"><svg class="ic"><use href="#i-clock"/></svg>Tải sau</button>
      <button class="btn primary" id="start" type="button"><svg class="ic"><use href="#i-download"/></svg>Tải ngay</button>
    </div>
  </div>
</main>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="confirm.js"></script>
</body>
</html>
