<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đang tải</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="progress.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></symbol>
</svg>

<main class="pw" id="pw">
  <div class="head">
    <span class="badge" id="badge" data-cat="other"><svg class="ic"><use id="badgeUse" href="#i-file"/></svg></span>
    <div class="headtxt">
      <div class="name" id="name">…</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="pct" id="pct">0%</div>
  </div>

  <div class="bar" id="bar"><i id="fill"></i></div>

  <dl class="stats" id="stats">
    <div><dt>Đã tải</dt><dd id="got">—</dd></div>
    <div><dt>Tốc độ</dt><dd id="spd">—</dd></div>
    <div><dt>Còn lại</dt><dd id="eta">—</dd></div>
    <div><dt>Trạng thái</dt><dd id="stat">—</dd></div>
  </dl>
  <div class="ask hidden" id="errAsk">
    <div class="asktxt" id="errTxt">Tải bị lỗi.</div>
    <div class="askrow">
      <span>Lần sau khi tải lỗi:</span>
      <button class="btn" id="errKeep" type="button">Giữ cửa sổ</button>
      <button class="btn" id="errClose" type="button">Tự đóng</button>
    </div>
  </div>

  <div class="foot">
    <label class="chk"><input type="checkbox" id="auto"><span>Tự đóng khi xong</span></label>
    <div class="actions" id="actDl">
      <button class="btn" id="pause" type="button">Tạm dừng</button>
      <button class="btn ghost" id="cancel" type="button">Hủy tải</button>
      <button class="btn" id="hide" type="button">Ẩn</button>
    </div>
    <div class="actions hidden" id="actDone">
      <button class="btn primary" id="open" type="button">Mở tệp</button>
      <button class="btn" id="folder" type="button">Mở thư mục</button>
      <button class="btn ghost" id="close" type="button">Đóng</button>
    </div>
  </div>
</main>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="progress.js"></script>
</body>
</html>
