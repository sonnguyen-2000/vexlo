<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#22385a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#2fe6a0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2fe6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="335">
      <stop offset="0" stop-color="#8bffc4"/>
      <stop offset="1" stop-color="#18c2d6"/>
    </linearGradient>
    <linearGradient id="tray" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="392" y2="0">
      <stop offset="0" stop-color="#18c2d6"/>
      <stop offset="1" stop-color="#4be3a0"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="200">
      <stop offset="0" stop-color="#8bffc4" stop-opacity="0"/>
      <stop offset="1" stop-color="#8bffc4" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="230" fill="url(#gloss)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
  <!-- speed streaks -->
  <g stroke="url(#streak)" stroke-width="16" stroke-linecap="round">
    <path d="M160 70V176"/>
    <path d="M352 70V176"/>
    <path d="M110 118V196" stroke-width="12"/>
    <path d="M402 118V196" stroke-width="12"/>
  </g>
  <!-- arrow glow + arrow -->
  <g filter="url(#soft)" opacity=".55" stroke="#2fe6a0" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 104V300"/><path d="M164 236L256 328L348 236"/>
  </g>
  <g stroke="url(#arrow)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 104V300"/><path d="M164 236L256 328L348 236"/>
  </g>
  <!-- tray -->
  <path d="M120 366V392a24 24 0 0 0 24 24H368a24 24 0 0 0 24-24V366" fill="none" stroke="url(#tray)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
