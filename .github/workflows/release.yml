# Builds the Windows installer and publishes a GitHub Release whenever a tag like v0.2.0 is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, so the release notes can list the commits since the last release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests (informational)
        run: npm test
        continue-on-error: true

      - name: Build the Edge/Chrome extension folder
        run: node tools/make-edge.js

      - name: Build the installer and publish the release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the browser extensions to the release
        shell: pwsh
        run: |
          Compress-Archive -Path extension\* -DestinationPath Vexlo-firefox-extension.zip -Force
          Compress-Archive -Path extension-edge\* -DestinationPath Vexlo-edge-extension.zip -Force
          gh release upload "${{ github.ref_name }}" Vexlo-firefox-extension.zip Vexlo-edge-extension.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the release notes from the commit messages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ github.ref_name }}"
          $prev = $null
          try { $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null) } catch { $prev = $null }
          if ($LASTEXITCODE -ne 0) { $prev = $null }
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $lines = @(git log $range --no-merges --pretty=format:"%s" | Where-Object { $_ -and $_ -notmatch '^(v?\d+\.\d+\.\d+$|Release |Bump )' } | ForEach-Object { "- $_" })
          if ($lines.Count -gt 0) {
            ("## What's new`n`n" + ($lines -join "`n")) | Set-Content -Path release-notes.md -Encoding utf8
            gh release edit $tag --notes-file release-notes.md
          }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
